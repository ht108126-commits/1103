<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程作業管理系統</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>新增作業</h2>
    <form action="/add" method="POST">
        <div class="form-group">
            <label for="course_name">課程名稱:</label>
            <input type="text" id="course_name" name="course_name" required>
        </div>
        <div class="form-group">
            <label for="homework_name">作業名稱:</label>
            <input type="text" id="homework_name" name="homework_name" required>
        </div>
        <div class="form-group">
            <label for="due_date">繳交日期:</label>
            <input type="date" id="due_date" name="due_date" required>
        </div>
        <button type="submit">新增作業</button>
    </form>

    <hr>

    <h2>作業列表</h2>
    <table>
        <thead>
            <tr>
                <th>課程名稱</th>
                <th>作業名稱</th>
                <th>繳交日期</th>
            </tr>
        </thead>
        <tbody>
            {% for hw in homeworks %}
            <tr>
                <td>{{ hw.course }}</td>
                <td>{{ hw.homework }}</td>
                <td>{{ hw.due_date }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align: center;">目前沒有任何作業</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
